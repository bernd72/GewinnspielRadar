name: Gewinnspiele suchen und veröffentlichen

on:
  workflow_dispatch:
  schedule:
    # Täglich 07:17 UTC = 08:17 MEZ / 09:17 MESZ
    - cron: '17 7 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/gewinnspiele.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gewinnspielradar
  cancel-in-progress: false

jobs:
  sammeln-und-veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository abrufen
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: Gewinnspiele sammeln
        run: python scripts/collect.py
      - name: Datenbestand aktualisieren
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/gewinnspiele.json
          if ! git diff --cached --quiet; then
            git commit -m 'Gewinnspiel-Daten automatisch aktualisieren'
            git push
          fi
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Website zusammenstellen
        run: |
          mkdir -p _site/data
          cp index.html icon.svg _site/
          cp data/gewinnspiele.json _site/data/
          touch _site/.nojekyll
      - name: Seiten-Artefakt erstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
